name: Build release packages

on:
  push:
    tags:
      - 'v1.5.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Test client
        run: |
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

      - name: Build Android
        run: |
          flutter build apk --release
          Copy-Item build\app\outputs\flutter-apk\app-release.apk release\AILearningOS-android-v1.5.0.apk

      - name: Test and build backend
        working-directory: server
        run: |
          dart pub get
          dart analyze
          dart test
          dart build cli -o build-v4.0

      - name: Package backend
        shell: pwsh
        run: |
          $binary = 'release\AILearningOS-server-windows-x64-v4.0'
          $source = 'release\AILearningOS-server-source-v4.0'
          New-Item -ItemType Directory -Path "$binary\bin", "$binary\lib", $source -Force | Out-Null
          Copy-Item server\build-v4.0\bundle\bin\server.exe "$binary\bin\server.exe"
          Copy-Item server\build-v4.0\bundle\lib\sqlite3.dll "$binary\lib\sqlite3.dll"
          Copy-Item server\build-v4.0\bundle\lib\sqlite3.dll "$binary\bin\sqlite3.dll"
          Copy-Item server\start-server.ps1 "$binary\start-server.ps1"
          Copy-Item server\部署与验收-v4.0.md "$binary\部署指南.md"
          Copy-Item server\bin,server\lib,server\test -Destination $source -Recurse
          Copy-Item server\analysis_options.yaml,server\pubspec.yaml,server\pubspec.lock,server\README.md,server\Canvas接入.md,server\部署与验收-v4.0.md,server\start-server.ps1 -Destination $source
          Compress-Archive -LiteralPath $binary -DestinationPath release\AILearningOS-server-windows-x64-v4.0.zip -CompressionLevel Optimal
          Compress-Archive -LiteralPath $source -DestinationPath release\AILearningOS-server-source-v4.0.zip -CompressionLevel Optimal
          Get-FileHash release\AILearningOS-android-v1.5.0.apk,release\AILearningOS-server-windows-x64-v4.0.zip,release\AILearningOS-server-source-v4.0.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release\SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/AILearningOS-android-v1.5.0.apk
            release/AILearningOS-server-windows-x64-v4.0.zip
            release/AILearningOS-server-source-v4.0.zip
            release/SHA256SUMS.txt
